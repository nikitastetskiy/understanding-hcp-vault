services:
  vault:
    image: ${VAULT_IMAGE:-hashicorp/vault-enterprise:2.0.3-ent}
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_LICENSE: ${VAULT_LICENSE}
    ports:
      - "18200:8200"
    command: server -dev -dev-listen-address=0.0.0.0:8200
