services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.17.3}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic-lab-password}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:19200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:${ELASTIC_PASSWORD:-elastic-lab-password} http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  elastic-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.17.3}
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic-lab-password}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:-kibana-lab-password}
    command:
      - sh
      - -c
      - >-
        curl -fsS -u "elastic:$${ELASTIC_PASSWORD}"
        -H 'Content-Type: application/json'
        -X POST http://elasticsearch:9200/_security/user/kibana_system/_password
        -d "{\"password\":\"$${KIBANA_PASSWORD}\"}"
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.17.3}
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:-kibana-lab-password}
    ports:
      - "127.0.0.1:15601:5601"
    depends_on:
      elastic-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  elastic-agent:
    image: docker.elastic.co/beats/elastic-agent:${ELASTIC_VERSION:-8.17.3}
    user: root
    environment:
      FLEET_ENROLL: "0"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic-lab-password}
    volumes:
      - ./elastic-agent.yml:/usr/share/elastic-agent/elastic-agent.yml:ro
      - vault-logs:/var/log/vault:ro
    ports:
      - "127.0.0.1:19007:9007"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9007'"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      kibana:
        condition: service_healthy

  vault:
    image: ${VAULT_IMAGE:-hashicorp/vault:1.20.4}
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_LOG_FORMAT: json
      VAULT_LOG_LEVEL: info
    command:
      - server
      - -dev
      - -log-file=/vault/logs/vault-operational.json
    ports:
      - "127.0.0.1:18201:8200"
    volumes:
      - vault-logs:/vault/logs
    depends_on:
      elastic-agent:
        condition: service_healthy

volumes:
  vault-logs:
